name: Release

# On a version tag: test, then publish the orchestrator image, the runner
# images and the binaries. Hosts pick the new images up through DockWarden.
on:
    push:
        tags: ["v*"]
    # Tags created by release-please with GITHUB_TOKEN fire no push event;
    # release-please.yml dispatches this workflow on the tag instead.
    workflow_dispatch:

# Least privilege: each job asks for what it needs.
permissions:
    contents: read

env:
    IMAGE: ghcr.io/${{ github.repository }}
    RUNNER_IMAGE: ghcr.io/${{ github.repository }}-runner

jobs:
    test:
        # Only ever for a version tag (a manual dispatch on a branch does nothing).
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
            - name: Run the CI suite
              run: ./scripts/ci.sh

    orchestrator:
        runs-on: ubuntu-latest
        needs: test
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v6
            - uses: docker/setup-qemu-action@v4
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
            - id: when
              run: echo "now=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      VERSION=${{ github.ref_name }}
                      BUILD_TIME=${{ steps.when.outputs.now }}

    runner-images:
        runs-on: ubuntu-latest
        needs: test
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                flavor: [base, node, go, python, media, full]
        steps:
            - uses: actions/checkout@v6
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.RUNNER_IMAGE }}
                  flavor: |
                      latest=false
                      prefix=${{ matrix.flavor }}-
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
            - uses: docker/build-push-action@v7
              with:
                  context: docker/runner
                  target: ${{ matrix.flavor }}
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

    binaries:
        runs-on: ubuntu-latest
        needs: test
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
            - name: Build binaries
              env:
                  VERSION: ${{ github.ref_name }}
              run: |
                  mkdir -p dist
                  build() {
                      CGO_ENABLED=0 GOOS="$1" GOARCH="$2" go build -trimpath \
                          -ldflags "-s -w -X main.version=${VERSION} -X main.buildTime=$(date -u +%FT%TZ)" \
                          -o "dist/$3" ./cmd/scalerunnergh
                  }
                  build linux amd64 scalerunnergh-linux-amd64
                  build linux arm64 scalerunnergh-linux-arm64
                  build windows amd64 scalerunnergh-windows-amd64.exe
                  cp deploy/windows/install.ps1 deploy/systemd/scalerunnergh.service dist/
                  (cd dist && sha256sum scalerunnergh-* > SHA256SUMS)
            - name: Attach to the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: gh release upload "$TAG" dist/* --clobber
