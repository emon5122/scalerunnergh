name: release-please

on:
    push:
        branches: [main]

# Runs on the built-in GITHUB_TOKEN (no PAT secret). The repo setting
# "Allow GitHub Actions to create and approve pull requests" must be on.
permissions:
    contents: write
    issues: write
    pull-requests: write
    actions: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@v5
              id: rp
              with:
                  release-type: go
                  token: ${{ github.token }}

            # PRs and tags created with GITHUB_TOKEN trigger no workflows, so
            # CI and the release build are dispatched from here instead
            # (workflow_dispatch is allowed from GITHUB_TOKEN).
            - name: Dispatch CI on the release PR branch
              if: steps.rp.outputs.prs_created == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  PRS: ${{ steps.rp.outputs.prs }}
              run: |
                  echo "$PRS" | jq -r '.[].headBranchName' | while read -r branch; do
                      echo "Dispatching ci.yml on $branch"
                      gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
                  done

            - name: Dispatch the release build on the new tag
              if: steps.rp.outputs.release_created == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.rp.outputs.tag_name }}
              run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
