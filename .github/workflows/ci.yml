name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25"

            - name: Build
              run: go build ./...

            - name: Test
              run: go test ./... -v -count=1

            - name: Test with Race Detector
              run: go test ./... -race -count=1

            - name: Vet
              run: go vet ./...

    build-docker:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v4

            - name: Build orchestrator image
              run: docker build -t scalerunnergh:test .

            - name: Verify binary in image
              run: docker run --rm scalerunnergh:test --version

            - name: Build runner image
              run: docker build -t scalerunnergh-runner:test docker/runner/
