name: CI

# Runs on pull requests (the release PR included) and on tags, not on every
# push to main. The repo is public, so GitHub-hosted runners cost nothing.
on:
    pull_request:
        branches: [main]
    push:
        tags: ["v*"]
    # Release PRs opened by release-please with GITHUB_TOKEN get no
    # pull_request event; release-please.yml dispatches CI on their branch.
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod

            - name: Run the CI suite
              run: ./scripts/ci.sh

    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod

            # The OS-neutral packages are tested here; the native backend's
            # process handling on Windows is verified on a real host.
            - name: Build, vet and test on Windows
              run: |
                  go build ./...
                  go vet ./...
                  go test ./internal/scaler ./internal/pool ./internal/guard ./internal/ghapi ./internal/metrics -count=1
